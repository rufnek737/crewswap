name = "crewswap-api"
main = "index.js"
compatibility_date = "2025-06-17"
compatibility_flags = ["nodejs_compat"]

[vars]
# 정식 권한은 서버의 영구 이용권 또는 사용자가 직접 시작한 30일 무료 이용권으로 판정한다.
BETA_ALL_PREMIUM = "false"

# 사용자·스왑 글·요청·크레딧은 D1에 저장한다. KV 무료 플랜의 일일 쓰기 한도(1,000회)가
# 회원가입·인증에서 먼저 소진돼 서비스가 멈추던 문제 때문이며, D1 무료 한도는 하루 10만 행이다.
[[d1_databases]]
binding = "DB"
database_name = "crewswap-db"
database_id = "e1da5a84-a945-4e02-8c1a-656c5ef9f105"

# KV는 D1 전환 전 데이터 보관과 인증 요청 제한 폴백(로컬·구환경)에만 남겨둔다.
[[kv_namespaces]]
binding = "POSTS"
id = "7da2a6e5ee7143fcab6834bf9ba92a17"

# 인증 요청 제한은 사용자 데이터용 KV와 분리한다. Cloudflare Rate Limiting
# 바인딩은 KV put을 발생시키지 않아 무료 KV 일일 쓰기 한도를 보호한다.
[[ratelimits]]
name = "VERIFY_RATE_LIMITER"
namespace_id = "737001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "737002"

  [ratelimits.simple]
  limit = 10
  period = 60

# 환경변수는 평문 vars 대신 secret으로 설정 (wrangler secret put VERIFY_SECRET 등)
# 로컬 개발용 .dev.vars 파일에 아래 형식으로 작성:
#   AUTH_SECRET=generate-a-long-random-secret
#   VERIFY_SECRET=your-secret
#   RESEND_API_KEY=re_xxxx
#   RESEND_FROM=CrewSwap <no-reply@notify.rufnekcrew.com>
